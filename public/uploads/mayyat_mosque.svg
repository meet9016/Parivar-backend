        <stop offset="0%" stop-color="#b6841e" stop-opacity="0.95"/>
        <stop offset="45%" stop-color="#d8b150" stop-opacity="0.9"/>
        <stop offset="85%" stop-color="#f5e1a9" stop-opacity="0.98"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95"/>
      </linearGradient>
    </defs>
    <g fill="url(#mosqueGrad)">
      <!-- Outer Tall Minaret -->
      <rect x="25" y="170" width="26" height="170" rx="2"/>
      <rect x="21" y="215" width="34" height="8" rx="2"/>
