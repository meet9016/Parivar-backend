      <path d="M 85,255 C 85,215 105,198 122,188 C 140,198 158,215 158,255 Z" opacity="0.9"/>
      <line x1="122" y1="188" x2="122" y2="170" stroke="url(#mosqueGrad)" stroke-width="2"/>
      <circle cx="122" cy="168" r="2.5"/>

      <!-- Crescent Moon in Sky -->
      <path d="M 235,36 A 20,20 0 1,1 234.8,58 A 15.5,15.5 0 1,0 235,36 Z" transform="rotate(-18 235 48)"/>
      <!-- Shimmer Star -->
      <polygon points="260,38 262,44 268,44 263,48 265,54 260,50 255,54 257,48 252,44 258,44" fill="url(#mosqueGrad)"/>
