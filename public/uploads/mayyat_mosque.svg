      <rect x="82" y="135" width="18" height="50" rx="2"/>
      <rect x="87" y="148" width="8" height="16" rx="4" fill="#fdf8ef" opacity="0.4"/>
      <path d="M 76,135 L 106,135 L 102,125 L 80,125 Z"/>
      <path d="M 82,125 C 82,105 91,92 91,78 C 91,92 100,105 100,125 Z"/>
      <line x1="91" y1="78" x2="91" y2="62" stroke="url(#mosqueGrad)" stroke-width="2"/>
      <circle cx="91" cy="60" r="2.5"/>
      <path d="M 91,54 A 6,6 0 1,1 90.9,61 A 4.5,4.5 0 1,0 91,54 Z"/>

      <!-- Grand Center Mosque Dome -->
      <rect x="110" y="235" width="165" height="105" rx="3"/>
      <path d="M 120,235 C 120,165 155,130 192,108 C 230,130 265,165 265,235 Z"/>
